components:
  parameters:
    pageParam:
      name: page
      in: query
      description: Pagination token from a previous response
      schema:
        type: string
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 1000
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    Unauthorized_2:
      description: Authentication required or credentials invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    DataGuardAssociationSummary:
      type: object
      properties:
        id:
          type: string
        databaseId:
          type: string
        peerDatabaseId:
          type: string
        role:
          type: string
          enum:
          - PRIMARY
          - STANDBY
          - DISABLED_STANDBY
        peerRole:
          type: string
        lifecycleState:
          type: string
        protectionMode:
          type: string
          enum:
          - MAXIMUM_AVAILABILITY
          - MAXIMUM_PERFORMANCE
          - MAXIMUM_PROTECTION
        transportType:
          type: string
          enum:
          - SYNC
          - ASYNC
          - FASTSYNC
        applyLag:
          type: string
        applyRate:
          type: string
        timeCreated:
          type: string
          format: date-time
    UpdateDataGuardDatabaseRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - ENABLE
          - DISABLE
          - CONVERT
          - SWITCHOVER
          - FAILOVER
    DataGuardConfiguration:
      type: object
      properties:
        configuration_name:
          type: string
        protection_mode:
          type: string
        enabled:
          type: boolean
        databases:
          type: array
          items:
            $ref: '#/components/schemas/DataGuardDatabase'
    UpdateDataGuardConfigRequest:
      type: object
      properties:
        enabled:
          type: boolean
        protection_mode:
          type: string
    Error_2:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        type:
          type: string
    DataGuardDatabaseList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataGuardDatabase'
    CreateDataGuardConfigRequest:
      type: object
      required:
      - configuration_name
      properties:
        configuration_name:
          type: string
        protection_mode:
          type: string
          enum:
          - MAXIMUM_AVAILABILITY
          - MAXIMUM_PERFORMANCE
          - MAXIMUM_PROTECTION
    DataGuardDatabase:
      type: object
      properties:
        database_name:
          type: string
        role:
          type: string
          enum:
          - PRIMARY
          - PHYSICAL_STANDBY
          - LOGICAL_STANDBY
          - SNAPSHOT_STANDBY
        enabled:
          type: boolean
        transport_lag:
          type: string
        apply_lag:
          type: string
    AddDataGuardDatabaseRequest:
      type: object
      required:
      - database_name
      - connect_identifier
      properties:
        database_name:
          type: string
        connect_identifier:
          type: string
    DataguardConfigurationPropertiesCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataguardConfigurationPropertyItem'
        hasMore:
          type: boolean
          description: Indicates if there are more records to be retrieved.
        limit:
          type: integer
          description: The actual page size limit on number of records applied by the server.
        offset:
          type: integer
          description: The actual index from which the item resources are returned.
        count:
          type: integer
          description: Total number of records in the current response.
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkRelation'
    DataguardInstanceCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataguardInstanceItem'
        hasMore:
          type: boolean
          description: Indicates if there are more records to be retrieved.
        limit:
          type: integer
          description: The actual page size limit on number of records applied by the server.
        offset:
          type: integer
          description: The actual index from which the item resources are returned.
        count:
          type: integer
          description: Total number of records in the current response.
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkRelation'
    DataguardConfigurationItemLinks:
      type: object
