openapi: 3.2.0
info:
  title: Oracle Database Data Guard API
  x-refined-note:
  - x-refined-note differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Data Guard across 3 of this provider''s published API definitions: oracle-database-oci-openapi.yml, oracle-database-ords-openapi.yml, oracle-database-data-guard-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://database.{region}.oraclecloud.com/20160918
  description: OCI Database Service Regional Endpoint
  variables:
    region:
      default: us-ashburn-1
      description: OCI region identifier
      enum:
      - us-ashburn-1
      - us-phoenix-1
      - eu-frankfurt-1
      - uk-london-1
      - ap-tokyo-1
      - ap-mumbai-1
      - ca-toronto-1
      - ap-sydney-1
      - sa-saopaulo-1
      - ap-seoul-1
- url: https://{host}:{port}/ords
  description: ORDS Server
  variables:
    host:
      default: localhost
      description: ORDS server hostname
    port:
      default: '8443'
      description: ORDS server port
tags:
- name: Data Guard
  description: Manage Data Guard associations for high availability
paths:
  /dataGuardAssociations:
    get:
      operationId: listDataGuardAssociations
      summary: Oracle Database List Data Guard associations
      description: Returns Data Guard associations for the specified database.
      tags:
      - Data Guard
      parameters:
      - name: databaseId
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/pageParam'
      responses:
        '200':
          description: Data Guard associations listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataGuardAssociationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - ociSignature: []
    servers:
    - url: https://database.{region}.oraclecloud.com/20160918
      description: OCI Database Service Regional Endpoint
      variables:
        region:
          default: us-ashburn-1
          description: OCI region identifier
          enum:
          - us-ashburn-1
          - us-phoenix-1
          - eu-frankfurt-1
          - uk-london-1
          - ap-tokyo-1
          - ap-mumbai-1
          - ca-toronto-1
          - ap-sydney-1
          - sa-saopaulo-1
          - ap-seoul-1
  /database/dataguard/configuration/:
    get:
      operationId: getDataGuardConfiguration
      summary: Oracle Database Get Data Guard broker configuration
      description: Returns the current Data Guard broker configuration.
      tags:
      - Data Guard
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGuardConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      security:
      - oauth2: []
      - basicAuth: []
    post:
      operationId: addDataGuardConfiguration
      summary: Oracle Database Add a Data Guard configuration
      description: Creates a new Data Guard broker configuration.
      tags:
      - Data Guard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataGuardConfigRequest'
      responses:
        '201':
          description: Configuration added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGuardConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      security:
      - oauth2: []
      - basicAuth: []
    put:
      operationId: updateDataGuardConfiguration
      summary: Oracle Database Enable or disable Data Guard configuration
      description: Enables or disables the Data Guard broker configuration.
      tags:
      - Data Guard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataGuardConfigRequest'
      responses:
        '200':
          description: Configuration updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      security:
      - oauth2: []
      - basicAuth: []
    delete:
      operationId: removeDataGuardConfiguration
      summary: Oracle Database Remove Data Guard configuration
      description: Removes the Data Guard broker configuration.
      tags:
      - Data Guard
      responses:
        '200':
          description: Configuration removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      security:
      - oauth2: []
      - basicAuth: []
    servers:
    - url: https://{host}:{port}/ords
      description: ORDS Server
      variables:
        host:
          default: localhost
          description: ORDS server hostname
        port:
          default: '8443'
          description: ORDS server port
  /database/dataguard/databases/:
    get:
      operationId: getDataGuardDatabases
      summary: Oracle Database Get all Data Guard databases
      description: Returns all databases registered with the Data Guard broker.
      tags:
      - Data Guard
      responses:
        '200':
          description: Databases retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGuardDatabaseList'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      security:
      - oauth2: []
      - basicAuth: []
    post:
      operationId: addDataGuardDatabase
      summary: Oracle Database Add a database to Data Guard
      description: Adds a database to the Data Guard broker configuration.
      tags:
      - Data Guard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDataGuardDatabaseRequest'
      responses:
        '201':
          description: Database added successfully
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      security:
      - oauth2: []
      - basicAuth: []
    servers:
    - url: https://{host}:{port}/ords
      description: ORDS Server
      variables:
        host:
          default: localhost
          description: ORDS server hostname
        port:
          default: '8443'
          description: ORDS server port
  /database/dataguard/databases/{database}:
    put:
      operationId: updateDataGuardDatabase
      summary: Oracle Database Update Data Guard database role
      description: Converts, enables, or disables a database in the Data Guard configuration.
      tags:
      - Data Guard
      parameters:
      - name: database
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataGuardDatabaseRequest'
      responses:
        '200':
          description: Database role updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - oauth2: []
      - basicAuth: []
    delete:
      operationId: removeDataGuardDatabase
      summary: Oracle Database Remove database from Data Guard
      description: Removes a database from the Data Guard broker configuration.
      tags:
      - Data Guard
      parameters:
      - name: database
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Database removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - oauth2: []
      - basicAuth: []
    servers:
    - url: https://{host}:{port}/ords
      description: ORDS Server
      variables:
        host:
          default: localhost
          description: ORDS server hostname
        port:
          default: '8443'
          description: ORDS server port
    get:
      tags:
      - Data Guard
      summary: Get the current broker configuration database
      description: All the broker confguration database. A client requires SQL Administrator role to invoke this service.
      parameters:
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Information on a specific database in the broker configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataguardConfigurationItemLinks'
      x-internal-id: database-dataguard-databases-{database}-get
      x-filename-id: database-dataguard-databases-database-get
      operationId: getDatabaseDataguardDatabasesByDatabase
      x-operation-id-source: derived
      security:
      - oauth2: []
      - basicAuth: []
