      description: SQL statements to perform database operation
      example:
      - CREATE TABLE "MYSCHEMA"."EXAMPLE_TABLE"("ID" NUMBER, "DATE_RECV" DATE);
    data_load_object:
      type: object
      properties:
        object_name:
          type: string
          description: Name of object to load
          example: sales.csv
    credential:
      type: object
      properties:
        owner:
          type: string
          description: Owner of the credential.
          example: SCOTT
        credential_name:
          type: string
          description: Name of the credential.
          example: MYCRED
        username:
          type: string
          example: CLOUDUSER
        password:
          type: string
          example: trustno1
        windows_domain:
          type: string
