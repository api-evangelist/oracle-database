      example:
        ignoreblanklines: true
        ignoremissingcolumns: true
        blankasnull: true
        rejectlimit: 10000
        trimspaces: lrtrim
        characterset: AL32UTF8
        skipheaders: 1
    sql_statements:
      type: array
      items:
        description: SQL statement
