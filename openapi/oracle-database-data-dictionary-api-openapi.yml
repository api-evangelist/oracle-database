      description: Returns metadata for a specific table column.
      tags:
      - Data Dictionary
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: table_name
        in: path
        required: true
        schema:
          type: string
      - name: column_name
        in: path
