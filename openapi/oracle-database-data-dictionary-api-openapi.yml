        table_name:
          type: string
          description: Name associated with the table (or view) with the constraint definition.
        r_owner:
          type: string
          description: Owner of the table referred to in a referential constraint.
        r_constraint_name:
          type: string
          description: Owner of the constraint definition.
        columns:
