openapi: 3.2.0
info:
  title: Oracle Database Data Dictionary API
  x-refined-note:
  - x-summary differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Data Dictionary across 2 of this provider''s published API definitions: oracle-database-ords-openapi.yml, oracle-database-data-dictionary-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{host}:{port}/ords
  description: ORDS Server
  variables:
    host:
      default: localhost
      description: ORDS server hostname
    port:
      default: '8443'
      description: ORDS server port
tags:
- name: Data Dictionary
  description: Database tables, views, columns, indexes, and object metadata
paths:
  /database/objects/tables/:
    get:
      operationId: getTables
      summary: Oracle Database Get all tables
      description: Returns metadata for all database tables accessible to the current user.
      tags:
      - Data Dictionary
      parameters:
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: Tables retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - oauth2: []
      - basicAuth: []
    servers:
    - url: https://{host}:{port}/ords
      description: ORDS Server
      variables:
        host:
          default: localhost
          description: ORDS server hostname
        port:
          default: '8443'
          description: ORDS server port
  /database/objects/tables/{owner},{table_name}:
    get:
      operationId: getTable
      summary: Oracle Database Get a specific table
      description: Returns metadata for a specific database table.
      tags:
      - Data Dictionary
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: table_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Table metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - oauth2: []
      - basicAuth: []
    servers:
    - url: https://{host}:{port}/ords
      description: ORDS Server
      variables:
        host:
          default: localhost
          description: ORDS server hostname
        port:
          default: '8443'
          description: ORDS server port
  /database/objects/columns/:
    get:
      operationId: getColumns
      summary: Oracle Database Get all table columns
      description: Returns column metadata for all tables.
      tags:
      - Data Dictionary
      parameters:
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: Columns retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnList'
        '401':
