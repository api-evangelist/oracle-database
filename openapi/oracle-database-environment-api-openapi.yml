      x-filename-id: environment-homes-homename-dbca-jobs-jobid-log-get
      operationId: getEnvironmentHomesByHomeNameDbcaJobsByJobIdLog
      x-operation-id-source: derived
  /environment/homes/{homeName}/dbca/templates/:
