openapi: 3.2.0
info:
  title: Oracle Database General API
  x-refined-note:
  - x-refined-note differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged General across 2 of this provider''s published API definitions: oracle-database-ords-openapi.yml, oracle-database-general-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{host}:{port}/ords
  description: ORDS Server
  variables:
    host:
      default: localhost
      description: ORDS server hostname
    port:
      default: '8443'
      description: ORDS server port
tags:
- name: General
  description: Core database instance status, version, and configuration services
paths:
  /database/status:
    get:
      operationId: getDatabaseStatus
      summary: Oracle Database Get database status
      description: Returns the current status of the Oracle Database instance.
      tags:
      - General
      responses:
        '200':
          description: Database status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - oauth2: []
      - basicAuth: []
    servers:
    - url: https://{host}:{port}/ords
      description: ORDS Server
      variables:
        host:
          default: localhost
          description: ORDS server hostname
        port:
          default: '8443'
          description: ORDS server port
  /database/version:
